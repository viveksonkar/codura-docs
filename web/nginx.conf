server {
  listen 80;
  server_tokens off;

  # Embeddable widget: versioned path. Build outputs are named per version (channels.md §3, M2-07):
  # widget.js / widget.esm.js / hosted.js get a short cache so a v1 patch release propagates;
  # source maps are not served publicly.
  location /widget/v1/ {
    alias /usr/share/nginx/widget/v1/;
    location ~ \.map$ { return 404; }
    location ~ \.html$ { return 404; }
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    add_header Access-Control-Allow-Origin "*";
    add_header X-Content-Type-Options nosniff;
  }

  # Hosted Chat Page (FR-46): /c/{tenant-slug}/{assistant-slug}. The page may be iframed (?embed=1).
  location ~ ^/c/[A-Za-z0-9-]+/[A-Za-z0-9-]+/?$ {
    root /usr/share/nginx/widget/v1;
    try_files /hosted.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; base-uri 'none'; form-action 'none'";
  }

  # Widget demo page (dev only: widget keys are refused from this origin in production, ADR-0025).
  location = /demo { return 302 /demo/$is_args$args; }
  location = /demo/ {
    root /usr/share/nginx/widget/v1;
    try_files /demo.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
  }

  # Admin Console SPA: client-side routes fall back to index.html.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options DENY;
  }
}
